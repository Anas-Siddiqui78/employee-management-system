spring.application.name=employee-management-system

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Server
server.port=${PORT:${SERVER_PORT:8081}}

# JWT - set a strong secret in the environment
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
